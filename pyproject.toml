[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rex-kuairand-agent"
version = "0.1.0"
description = "Evidence-audited autonomous ML research agent for KuaiRand-Pure"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40.0",
  "jsonschema==4.26.0",
  "numpy==2.3.5",
  "openai==3.6.0",
  "pandas>=2.2.0",
  "psutil==7.1.2",
  "pydantic==2.12.5",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
tree = ["lightgbm==4.7.0", "scikit-learn==1.9.0"]
dev = ["pytest>=9.0.0", "ruff==0.16.5"]

[project.scripts]
rex = "rex.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rex.store" = ["schema.sql"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
