plugin: rex.models.experimental.context_fm:ExperimentalContextEnsembleFMPlugin
k: 16
lr: 0.001
l2: 0.000001
epochs: 7
batch_size: 8192
ensemble_members: 5
aggregation: mean
categorical_fields:
  - user_id
  - video_id
  - author_id
  - tab
  - dur_bucket
  - hour
  - is_rand
  - meta__video_type
  - meta__upload_type
  - meta__tag
  - meta__music_type
  - meta__aspect_bucket
  - meta__upload_age_bucket
  - meta__duration_consistency_bucket
  - bucket__pt_user_author_rate
  - bucket__pt_user_author_count
  - bucket__pt_user_author_days_since
  - bucket__pt_user_video_count
  - bucket__pt_user_video_positive
  - bucket__pt_user_video_days_since
  - bucket__pt_user_rate_h1p0
  - bucket__pt_user_rate_h7p0
