schema_version: "1.0"
execution_mode: production

# Running this configuration executes validation-only search. Confirmation,
# test prediction, and final submission remain explicitly disabled in code.
scientific_execution_enabled: true
scientific_execution:
  # Four 1.5 GiB workers fit Docker Desktop's 8 GiB VM while still running
  # candidate/control pairs across two folds concurrently.
  max_parallel_workers: 4
  max_parallel_folds: 3
  parallel_candidate_control: true
  max_memory_mb: 1536

validation_policy:
  discovery_split: shadow
  phases: [DISCOVERY, FINALIST_LOCKED, OFFICIAL_EVALUATED]
  official_evaluation_tokens: 1
  minimum_valid_families_before_plateau: 6
  cheap_sample: deterministic_stratified_complete_users
  full_pooled_probability_positive: 0.90
  finalization_reserve_seconds: 3600

project_root: .
runs_dir: runs
budget_config: configs/budget.yaml
protected_paths: configs/security/protected_paths.yaml
data_manifest: runs/data/data_manifest.json
raw_data_dir: data/KuaiRand-Pure/data
evaluator_path: kuairand-starter-kit/evaluate.py
environment_lock: requirements-lock.txt
process_stale_after_seconds: 900
cleanup_worktrees: true

# Versioned method-card bindings. E09 and neural E11-E13 are intentionally not
# selectable in this phase. E10 trains its two-branch blend with weights derived
# only from shadow evidence before any official-validation comparison.
method_cards:
  E16:
    config: configs/experiments/e16_context_mean.yaml
    feature_recipe: control
  E17:
    config: configs/experiments/e17_user_tab_cross.yaml
    feature_recipe: user_tab_cross
  E18:
    config: configs/experiments/e18_video_tab_cross.yaml
    feature_recipe: video_tab_cross
  E19:
    config: configs/experiments/e19_item_metadata.yaml
    feature_recipe: control
  E20:
    config: configs/experiments/e20_user_metadata.yaml
    feature_recipe: control
  E21:
    config: configs/experiments/e21_field_weighted_fm.yaml
    feature_recipe: control
  E22:
    config: configs/experiments/e22_candidate_recency.yaml
    feature_recipe: point_in_time_candidate_recency
  E23:
    config: configs/experiments/e23_multifeedback_history.yaml
    feature_recipe: multifeedback_history
  E24:
    config: configs/experiments/e24_regularized_tree.yaml
    feature_recipe: control
  E25:
    config: configs/experiments/e25_shadow_blend.yaml
    feature_recipe: control
  E26:
    config: configs/experiments/e26_pointwise_tree_item_metadata.yaml
    feature_recipe: control
  E27:
    config: configs/experiments/e27_pointwise_tree_full_metadata.yaml
    feature_recipe: control
  E28:
    config: configs/experiments/e28_recency_bucket_fm.yaml
    feature_recipe: candidate_recency_buckets
  E29:
    config: configs/experiments/e29_pointwise_tree_user_metadata.yaml
    feature_recipe: control
  E30:
    config: configs/experiments/e30_item_metadata_k32.yaml
    feature_recipe: control
  E15:
    config: configs/experiments/e15_context_ensemble.yaml
    feature_recipe: control
  E01:
    config: configs/experiments/e01_pair_rank_fm.yaml
    feature_recipe: control
  E02:
    config: configs/experiments/e02_tree_ranker.yaml
    feature_recipe: video_statistics
  E03:
    config: configs/experiments/e03_candidate_history.yaml
    feature_recipe: history_length
  E04:
    config: configs/experiments/e04_delta_ndcg_pair.yaml
    feature_recipe: control
  E05:
    config: configs/experiments/e05_hybrid_pair.yaml
    feature_recipe: control
  E06:
    config: configs/experiments/e06_repeat_exposure.yaml
    feature_recipe: repeat_exposure
  E07:
    config: configs/experiments/e07_affinity.yaml
    feature_recipe: author_duration_affinity
  E08:
    config: configs/experiments/e08_recency.yaml
    feature_recipe: recency_history
  E10:
    config: configs/experiments/e10_blend.yaml
    feature_recipe: shadow_blend

llm:
  mode: fixed
  retries: 2
  timeout_seconds: 180
  max_output_tokens_per_call: 3000
  codex_cli:
    executable: codex
    model: null
  claude_cli:
    executable: claude
    model: null
  openai_api:
    api_key_env: OPENAI_API_KEY
    model_env: OPENAI_MODEL
    store: false
    max_calls_per_run: 60
    max_total_tokens: 300000
  auto:
    # Automatic scientific mode never changes transaction type mid-flight.
    # Use `--llm fixed` explicitly for the deterministic config queue.
    provider_order: [codex_cli, claude_cli, openai_api]
    allow_paid_api_fallback: false
